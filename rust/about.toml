# Third-party notices for the Slint frontend binary (see
# `just slint-notices`). The accepted set mirrors `deny.toml`'s allow
# list; Slint's own paid Software License is a per-crate exception there
# and is accepted here the same way, so its text lands in the notices.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "LicenseRef-Slint-Software-3.0",
    "LicenseRef-PolyForm-Noncommercial-1.0.0",
    "PolyForm-Noncommercial-1.0.0",
    "OFL-1.1",
    "CC0-1.0",
    "MPL-2.0",
]

# The binary ships for the MiSTer (ARM32 musl) and desktop Linux; both
# graphs are walked so a target-only crate cannot slip through.
targets = [
    "armv7-unknown-linux-musleabihf",
    "x86_64-unknown-linux-gnu",
]

# The workspace crates are ours; their own license is in COPYING.
private = { ignore = true }

# The Slint crates are not clarified here: their license is a custom
# document cargo-about's scanner cannot map to an SPDX id, so it drops
# them with a warning no matter how they are pointed at the file.
# `scripts/generate-slint-notices.sh` appends them from the text the
# crates themselves ship.
