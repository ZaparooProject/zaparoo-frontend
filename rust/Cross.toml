#
# `cross` container customization. libfontconfig1-dev is needed by the
# HOST-side Slint compiler (a build dependency); the MiSTer binary itself
# has no fontconfig dependency.

# Desktop x86_64 releases. Building on a modern host bakes in that host's
# glibc symbol versions, which a Steam Deck (glibc 2.41) or any older
# distribution then refuses to run. cross's image is old enough that the
# result runs everywhere we ship. Slint's winit backend dlopens GL and
# wayland/X11; fontconfig is needed by the host-side Slint compiler, and
# libudev by gilrs-core's evdev backend.
[target.x86_64-unknown-linux-gnu]
pre-build = [
    "apt-get update && apt-get install --assume-yes libfontconfig1-dev libudev-dev",
]

# MiSTer deploy target: fully static musl build. The MiSTer image ships
# glibc 2.31 while cross's gnueabihf image links against a newer glibc,
# so a dynamic build cannot run there; static musl sidesteps glibc symbol
# versioning entirely.
[target.armv7-unknown-linux-musleabihf]
pre-build = ["apt-get update && apt-get install --assume-yes libfontconfig1-dev"]

[build.env]
# `cross` mounts only the cargo workspace (`rust/`) into the build
# container, but the .slint files and `src/fonts.rs` / `src/glyphs.rs`
# embed art and fonts from the repo's shared `resources/`. Every `cross`
# invocation exports this variable (the `arm32` and `x86-portable`
# recipes, which `scripts/deploy-mister.sh` and CI in turn call) so the
# directory is mounted at the same absolute path inside the container.
volumes = ["ZAPAROO_RESOURCES_DIR"]
# The container has no `.git/`, so `build-info` cannot ask git for the
# commit. `just release` exports these from the host (see
# `rust/build-info/build.rs`); unset, they fall back to "unknown" / "dev".
passthrough = ["ZAPAROO_OFFICIAL_BUILD", "ZAPAROO_BUILD_COMMIT", "ZAPAROO_BUILD_DATE"]
