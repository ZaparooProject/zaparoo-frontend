# Desktop: link through the system C compiler with mold. mold is a host
# convenience for faster incremental links; the portable x86_64 build in
# `cross` overrides RUSTFLAGS because its image lacks it (see the justfile).
[target.x86_64-unknown-linux-gnu]
linker = "cc"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
