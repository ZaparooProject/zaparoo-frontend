<svg width="256" height="256" viewBox="-28 -28 312 312" xmlns="http://www.w3.org/2000/svg">
  <!-- Two-tone favorite marker, authored as a NEUTRAL GRAYSCALE source so the
       frontend can recolor it from theme tokens instead of baking brand
       colors here. Before rasterizing, rust/frontend/src/glyphs.rs maps the
       white fill to the palette's marker color and the black keyline to its
       marker outline. The keyline layer extends past the fill so its outset
       reads as an outline; the widened viewBox keeps the thick stroke from
       clipping. Plain fill + stroke only (no paint-order/effects) so every
       SVG rasterizer draws it the same way. -->
  <path fill="#000" stroke="#000" stroke-width="40" stroke-linejoin="round" stroke-linecap="round" d="M128 224 34 132C12 110 10 75 29 52c22-27 62-29 86-5l13 13 13-13c24-24 64-22 86 5 19 23 17 58-5 80l-94 92Z"/>
  <path fill="#fff" d="M128 224 34 132C12 110 10 75 29 52c22-27 62-29 86-5l13 13 13-13c24-24 64-22 86 5 19 23 17 58-5 80l-94 92Z"/>
</svg>
