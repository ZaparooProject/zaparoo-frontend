name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # CI doesn't reuse incremental metadata across runs; it only bloats the
  # cached target directory. scripts/toolchain.sh passes these into the
  # container.
  CARGO_INCREMENTAL: 0
  # Strip debug info from test binaries to keep the cache small.
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always

# Lint, tests, and the MiSTer build run the same `just` recipes a developer
# does, inside the pinned toolchain image (Dockerfile.toolchain). The first
# job makes sure the image for scripts/toolchain/VERSION is published; the
# others pull it, so a runner needs only Docker and just.
jobs:
  toolchain:
    name: Toolchain image
    uses: ./.github/workflows/toolchain-image.yml
    permissions:
      contents: read
      packages: write

  lint:
    name: Lint
    needs: toolchain
    runs-on: ubicloud-standard-8
    permissions:
      contents: read
      packages: read
    env:
      ZAPAROO_TOOLCHAIN_IMAGE: ${{ needs.toolchain.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just@1.58.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            rust/target/docker
            rust/target/docker-cargo
          key: lint-${{ hashFiles('scripts/toolchain/VERSION') }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: lint-${{ hashFiles('scripts/toolchain/VERSION') }}-
      # fmt, clippy for the desktop, MiSTer, and snapshot feature sets,
      # cargo-deny, the toolkit-free guard, and the translation, notices,
      # and logo freshness checks. See the justfile's `_lint`.
      - name: just lint
        run: just lint

  test:
    name: Tests
    needs: toolchain
    runs-on: ubicloud-standard-8
    permissions:
      contents: read
      packages: read
    env:
      ZAPAROO_TOOLCHAIN_IMAGE: ${{ needs.toolchain.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just@1.58.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            rust/target/docker
            rust/target/docker-cargo
          key: test-${{ hashFiles('scripts/toolchain/VERSION') }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: test-${{ hashFiles('scripts/toolchain/VERSION') }}-
      # The workspace, then the MiSTer feature set (presenters, dual head).
      - name: just test
        run: just test

  arm32:
    name: MiSTer ARM32 build
    needs: toolchain
    runs-on: ubicloud-standard-8
    permissions:
      contents: read
      packages: read
    env:
      ZAPAROO_TOOLCHAIN_IMAGE: ${{ needs.toolchain.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just@1.58.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            rust/target/docker
            rust/target/docker-cargo
          key: arm32-${{ hashFiles('scripts/toolchain/VERSION') }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: arm32-${{ hashFiles('scripts/toolchain/VERSION') }}-
      - name: just arm32
        run: just arm32
      - name: Upload MiSTer binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-armv7-musl-${{ github.run_id }}
          path: rust/target/docker/armv7-unknown-linux-musleabihf/release/frontend
          if-no-files-found: error
          retention-days: 7
