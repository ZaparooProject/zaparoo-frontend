name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # CI doesn't reuse incremental metadata across runs; it only bloats the
  # cached `target/` and slows the Swatinem post-cache upload.
  CARGO_INCREMENTAL: 0
  # Strip debug info from test binaries to keep `target/` small for caching.
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always

# Every job runs on the bare runner: the Rust toolchain comes from
# rust-toolchain.toml, Slint's desktop backend builds against the
# fontconfig, wayland, xkbcommon, and udev dev packages, and the MiSTer
# build goes through `cross`, which needs the runner's Docker. Tool versions
# match the pins in `just install-tools`.
jobs:
  lint:
    name: Lint
    runs-on: ubicloud-standard-8
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Desktop libraries and host linker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libwayland-dev libxkbcommon-dev libudev-dev mold
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: rust
          prefix-key: "v1-lint"
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-deny@0.19.4
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: slint-tr-extractor@1.17.1
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: cargo-about@0.9.2
          args: --features cli
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (desktop)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The MiSTer feature set compiles different modules (the presenters,
      # the dual-head mirror).
      - name: clippy (MiSTer)
        run: cargo clippy -p frontend --no-default-features --features mister --all-targets -- -D warnings
      # The snapshot bin sits behind `required-features`, so `--all-targets`
      # alone never compiles it.
      - name: clippy (snapshot)
        run: cargo clippy -p frontend --features snapshot --all-targets -- -D warnings
      - name: cargo-deny
        run: cargo deny check
      - name: Toolkit-free guard
        run: bash ../scripts/check-toolkit-free.sh
      - name: Translation template is fresh
        run: bash ../scripts/check-translations.sh
      - name: Third-party notices are fresh
        run: bash ../scripts/check-notices.sh
      - name: Embedded system logos match their sources
        run: python3 ../scripts/prepare-system-logos.py --check

  test:
    name: Tests
    runs-on: ubicloud-standard-8
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Desktop libraries and host linker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libwayland-dev libxkbcommon-dev libudev-dev mold
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: rust
          prefix-key: "v1-test"
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: nextest
      - name: nextest (workspace)
        run: cargo nextest run --workspace
      # Presenter and dual-head tests only build under the MiSTer feature set.
      - name: nextest (MiSTer)
        run: cargo nextest run -p frontend --no-default-features --features mister

  arm32:
    name: MiSTer ARM32 build
    runs-on: ubicloud-standard-8
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: rust
          prefix-key: "v1-arm32"
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cross@0.2.5
      - name: ARM32 static build (cross, Cortex-A9)
        env:
          RUSTFLAGS: -C target-cpu=cortex-a9
          # Mounted into the cross container; see rust/Cross.toml.
          ZAPAROO_RESOURCES_DIR: ${{ github.workspace }}/resources
        run: cross build -p frontend --release --no-default-features --features mister --target armv7-unknown-linux-musleabihf
      - name: Upload MiSTer binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-armv7-musl-${{ github.run_id }}
          path: rust/target/armv7-unknown-linux-musleabihf/release/frontend
          retention-days: 7
